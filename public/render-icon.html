<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 512px;
      height: 512px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .icon-container {
      width: 512px;
      height: 512px;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="icon-container">
    <svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Vertical Gradients for the 3D loop matching reference image -->
        <linearGradient id="butterflyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fa759e" />
          <stop offset="25%" stop-color="#f472b6" />
          <stop offset="48%" stop-color="#a855f7" />
          <stop offset="72%" stop-color="#38bdf8" />
          <stop offset="100%" stop-color="#22d3ee" />
        </linearGradient>

        <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f472b6" />
          <stop offset="50%" stop-color="#9333ea" />
          <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>

        <!-- Drop shadow for 3D elevation -->
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
          <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.28" />
        </filter>
      </defs>

      <!-- Outer Squircle with thick black border and white background -->
      <rect x="16" y="16" width="480" height="480" rx="130" ry="130" fill="#ffffff" stroke="#000000" stroke-width="36" />

      <!-- Sparkle diamond in bottom-right corner of black border matching reference -->
      <path d="M 452 444 Q 452 452 460 452 Q 452 452 452 460 Q 452 452 444 452 Q 452 452 452 444 Z" fill="#9ca3af" />

      <!-- Butterfly Infinity Ribbon -->
      <g filter="url(#softShadow)">
        <!-- Continuous 3D bow shape -->
        <path
          d="M 256 264 
             C 218 316, 172 342, 142 342
             C 98 342, 72 290, 72 232
             C 72 174, 98 168, 142 168
             C 182 168, 222 216, 256 264
             C 290 216, 330 168, 370 168
             C 414 168, 440 174, 440 232
             C 440 290, 414 342, 370 342
             C 340 342, 294 316, 256 264 Z"
          fill="none"
          stroke="url(#butterflyGrad)"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <!-- Overlay segment to create 3D ribbon intertwine -->
        <path
          d="M 224 220 C 238 238, 256 264, 274 286 C 290 306, 308 324, 336 336"
          fill="none"
          stroke="url(#crossGrad)"
          stroke-width="36"
          stroke-linecap="round"
        />

        <!-- Subtle 3D specular highlight along upper crests -->
        <path
          d="M 142 174 C 112 174, 86 182, 86 232 C 86 280, 108 332, 142 332"
          fill="none"
          stroke="#ffffff"
          stroke-width="4.5"
          stroke-opacity="0.32"
          stroke-linecap="round"
        />
        <path
          d="M 370 174 C 400 174, 426 182, 426 232 C 426 280, 404 332, 370 332"
          fill="none"
          stroke="#ffffff"
          stroke-width="4.5"
          stroke-opacity="0.32"
          stroke-linecap="round"
        />
      </g>

      <!-- Exact Cursive 'mytube' brand name nestled in upper center dip -->
      <g transform="translate(256, 186)">
        <text
          x="0"
          y="0"
          text-anchor="middle"
          dominant-baseline="central"
          font-family="'Dancing Script', cursive, 'Brush Script MT', sans-serif"
          font-weight="700"
          font-style="italic"
          font-size="52"
          letter-spacing="-1px"
          fill="#1c1c1e"
        >
          mytube
        </text>
      </g>
    </svg>
  </div>
</body>
</html>
